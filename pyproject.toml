[project]
name = "math_visual_lab"
version = "0.1.0"
description = "Interactive math and signal processing visualization lab"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "dash>=2.14.0",
    "plotly>=5.18.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sympy>=1.12",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[project.scripts]
math-visual-lab = "app:main"
docker-start = "docker_start:main"

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["app", "docker_start"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (неиспользуемые импорты, undefined names)
    "I",   # isort (порядок импортов)
    "UP",  # pyupgrade (устаревший синтаксис)
    "B",   # bugbear (потенциальные баги)
]
ignore = [
    "E501",  # длинные строки — не критично для визуализаций
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

