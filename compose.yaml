services:
  math-visual-lab:
    build: .
    ports:
      - "8050:8050"
    environment:
      - DOCKER_ENV=1
    container_name: math_lab
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050')"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

